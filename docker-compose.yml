services:
  accessdrift:
    build:
      context: .
      dockerfile: Dockerfile
    image: accessdrift:latest
    container_name: accessdrift-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PORT=8000
      - HOST=0.0.0.0
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - accessdrift-network

networks:
  accessdrift-network:
    driver: bridge
